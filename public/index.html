<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-alt: #f1f0ec;
    --text: #1f1e1c;
    --text-2: #5f5e5a;
    --text-3: #8a8983;
    --border: rgba(31, 30, 28, 0.12);
    --border-strong: rgba(31, 30, 28, 0.24);
    --accent: #185fa5;
    --accent-hover: #0c447c;
    --accent-bg: #e6f1fb;
    --accent-text: #0c447c;
    --danger: #a32d2d;
    --warning-bg: #faeeda;
    --warning-text: #854f0b;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --t-service-bg: #eeedfe; --t-service-fg: #3c3489;
    --t-library-bg: #e1f5ee; --t-library-fg: #085041;
    --t-tool-bg: #faece7;    --t-tool-fg: #712b13;
    --t-feature-bg: #fbeaf0; --t-feature-fg: #72243e;
    --b-git-bg: #e8e7e2; --b-git-fg: #4a4944;
    --radius: 8px;
    --radius-lg: 12px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19;
      --surface: #242423;
      --surface-alt: #2c2c2a;
      --text: #f1efe8;
      --text-2: #b4b2a9;
      --text-3: #888780;
      --border: rgba(241, 239, 232, 0.12);
      --border-strong: rgba(241, 239, 232, 0.24);
      --accent: #378add;
      --accent-hover: #85b7eb;
      --accent-bg: #0c447c;
      --accent-text: #b5d4f4;
      --danger: #f09595;
      --warning-bg: #633806;
      --warning-text: #fac775;
      --success-bg: #27500a;
      --success-text: #c0dd97;
      --t-service-bg: #3c3489; --t-service-fg: #cecbf6;
      --t-library-bg: #085041; --t-library-fg: #9fe1cb;
      --t-tool-bg: #712b13;    --t-tool-fg: #f5c4b3;
      --t-feature-bg: #72243e; --t-feature-fg: #f4c0d1;
      --b-git-bg: #3a3a37; --b-git-fg: #d3d1c7;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent-bg); color: var(--accent-text);
    display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { margin: 0; font-size: 13px; color: var(--text-2); }

  button, input, select, textarea { font: inherit; color: inherit; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px;
    border-radius: var(--radius); border: 1px solid var(--border-strong);
    background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .btn:focus-visible, .field:focus-visible, .chip:focus-visible, .card-toggle:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .field {
    width: 100%; height: 38px; padding: 0 12px;
    border-radius: var(--radius); border: 1px solid var(--border-strong);
    background: var(--surface); transition: border-color 0.15s;
  }
  textarea.field { height: auto; min-height: 72px; padding: 8px 12px; resize: vertical; }
  .field.mono { font-family: var(--mono); font-size: 13px; }
  .field:hover { border-color: var(--text-3); }
  .field:focus { border-color: var(--accent); outline: none; }

  .search { position: relative; margin-bottom: 14px; }
  .search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 18px; }
  .search .field { height: 46px; padding-left: 42px; font-size: 15px; border-radius: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 13px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border-strong); background: transparent;
    color: var(--text-2); cursor: pointer;
  }
  .chip:hover { border-color: var(--text-3); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }

  .meta-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 10px; font-size: 12px; color: var(--text-3); }
  .list { display: grid; gap: 10px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card.deprecated { opacity: 0.72; }
  .card-toggle {
    display: flex; width: 100%; gap: 12px; align-items: flex-start; justify-content: space-between;
    padding: 16px 18px; background: none; border: 0; text-align: left; cursor: pointer;
    border-radius: var(--radius-lg);
  }
  .card-main { min-width: 0; }
  .title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .name { font-weight: 600; font-size: 15px; }
  .deprecated .name { text-decoration: line-through; color: var(--text-2); }
  .desc { margin: 6px 0 10px; font-size: 13.5px; color: var(--text-2); }
  .facts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-3); }
  .facts span { display: inline-flex; align-items: center; gap: 4px; }
  .chev { color: var(--text-3); font-size: 18px; flex-shrink: 0; transition: transform 0.2s; }
  .card[data-open="true"] .chev { transform: rotate(180deg); }

  .badge { font-size: 11.5px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .t-SERVICE { background: var(--t-service-bg); color: var(--t-service-fg); }
  .t-LIBRARY { background: var(--t-library-bg); color: var(--t-library-fg); }
  .t-TOOL    { background: var(--t-tool-bg);    color: var(--t-tool-fg); }
  .t-FEATURE { background: var(--t-feature-bg); color: var(--t-feature-fg); }
  .b-deprecated { background: var(--warning-bg); color: var(--warning-text); }
  .b-git { background: var(--b-git-bg); color: var(--b-git-fg); }
  .b-agent { background: var(--accent-bg); color: var(--accent-text); }

  .detail { border-top: 1px solid var(--border); margin: 0 18px; padding: 14px 0 16px; }
  .detail-label { margin: 0 0 4px; font-size: 12px; color: var(--text-3); }
  .code {
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word;
    background: var(--surface-alt); border-radius: var(--radius); padding: 10px 12px; margin: 0 0 12px;
  }
  .links { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .links a:hover { text-decoration: underline; }
  .hint { font-size: 13px; color: var(--text-2); margin: 0 0 10px; }
  .reviewed { font-size: 12px; color: var(--text-3); margin: 0; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; }
  .panel h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 4px; }
  .req { color: var(--danger); }
  .error { font-size: 13px; color: var(--danger); margin: 10px 0 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .state {
    text-align: center; padding: 40px 16px; border: 1px dashed var(--border-strong);
    border-radius: var(--radius-lg); color: var(--text-2);
  }
  .state i { font-size: 26px; color: var(--text-3); }
  .state p { margin: 6px 0 0; font-size: 13.5px; }
  .state strong { display: block; margin-top: 8px; color: var(--text); font-weight: 600; font-size: 14.5px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: var(--radius);
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .wrap { padding-top: 20px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .btn-label { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><i class="ti ti-books"></i></div>
      <div>
        <h1>Catálogo del equipo</h1>
        <p class="subtitle">Lo que ya existe, antes de construirlo de nuevo</p>
      </div>
    </div>
    <button class="btn" id="add-btn" type="button" aria-expanded="false" aria-controls="form-panel">
      <i class="ti ti-plus" aria-hidden="true"></i><span class="btn-label">Agregar ítem</span>
    </button>
  </header>

  <section class="panel" id="form-panel" hidden>
    <h2>Nuevo ítem del catálogo</h2>
    <form id="item-form" novalidate>
      <div class="grid">
        <div>
          <label for="f-name">Nombre <span class="req">*</span></label>
          <input class="field" id="f-name" name="name" maxlength="120" placeholder="Validador de CUIT" required>
        </div>
        <div>
          <label for="f-type">Tipo <span class="req">*</span></label>
          <select class="field" id="f-type" name="type">
            <option value="SERVICE">Servicio</option>
            <option value="LIBRARY">Librería</option>
            <option value="TOOL">Herramienta</option>
            <option value="FEATURE">Funcionalidad</option>
          </select>
        </div>
        <div class="full">
          <label for="f-description">Descripción <span class="req">*</span></label>
          <textarea class="field" id="f-description" name="description" maxlength="1000" placeholder="Qué hace y cuándo conviene usarlo"></textarea>
        </div>
        <div>
          <label for="f-owner">Responsable <span class="req">*</span></label>
          <input class="field" id="f-owner" name="owner" placeholder="Equipo backend">
        </div>
        <div>
          <label for="f-status">Estado</label>
          <select class="field" id="f-status" name="status">
            <option value="ACTIVE">Activo</option>
            <option value="DEPRECATED">Deprecado</option>
          </select>
        </div>
        <div>
          <label for="f-repo">Repositorio</label>
          <input class="field" id="f-repo" name="repoUrl" type="url" placeholder="https://github.com/org/repo">
        </div>
        <div>
          <label for="f-docs">Documentación</label>
          <input class="field" id="f-docs" name="docsUrl" type="url" placeholder="https://wiki.ejemplo.com/cuit">
        </div>
        <div class="full">
          <label for="f-install">Instalación</label>
          <input class="field mono" id="f-install" name="install" maxlength="500" placeholder="npm i @equipo/cuit">
        </div>
        <div class="full">
          <label for="f-usage">Ejemplo de uso</label>
          <textarea class="field mono" id="f-usage" name="usageExample" maxlength="2000" placeholder="validateCuit('20-12345678-9')"></textarea>
        </div>
        <div class="full">
          <label for="f-tags">Etiquetas (separadas por coma)</label>
          <input class="field" id="f-tags" name="tags" placeholder="validacion, afip, backend">
        </div>
      </div>
      <p class="error" id="form-error" role="alert" hidden></p>
      <div class="actions">
        <button class="btn" type="button" id="cancel-btn">Cancelar</button>
        <button class="btn btn-primary" type="submit" id="save-btn">Guardar ítem</button>
      </div>
    </form>
  </section>

  <div class="search">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input class="field" id="q" type="search" placeholder="Buscar por nombre, etiqueta o responsable" aria-label="Buscar en el catálogo" autocomplete="off">
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
  <div class="meta-row"><span id="count" aria-live="polite"></span></div>
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  const TYPES = { SERVICE: 'Servicio', LIBRARY: 'Librería', TOOL: 'Herramienta', FEATURE: 'Funcionalidad' };
  const state = { q: '', type: 'ALL', openId: null, requestSeq: 0 };
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const icon = (name) => el('i', { class: `ti ti-${name}`, 'aria-hidden': 'true' });

  function isSafeUrl(value) {
    try { return ['http:', 'https:'].includes(new URL(value).protocol); } catch { return false; }
  }

  function relativeReview(iso) {
    if (!iso) return null;
    const days = Math.round((Date.now() - new Date(iso).getTime()) / 86400000);
    const rtf = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
    if (days < 31) return rtf.format(-days, 'day');
    if (days < 365) return rtf.format(-Math.round(days / 30), 'month');
    return rtf.format(-Math.round(days / 365), 'year');
  }

  function renderChips() {
    const options = [['ALL', 'Todos'], ...Object.entries(TYPES)];
    $('chips').replaceChildren(...options.map(([value, label]) =>
      el('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(state.type === value),
        onclick: () => { state.type = value; renderChips(); load(); },
      }, label)
    ));
  }

  function renderState(iconName, title, text) {
    $('list').replaceChildren(el('div', { class: 'state' }, icon(iconName), el('strong', { text: title }), el('p', { text })));
  }

  function renderCard(item) {
    const deprecated = item.status === 'DEPRECATED';
    const agentReady = Boolean(item.install && item.usageExample);
    const open = state.openId === item.id;

    const badges = [
      el('span', { class: `badge t-${item.type}` }, (TYPES[item.type] || item.type).toLowerCase()),
      deprecated && el('span', { class: 'badge b-deprecated' }, 'deprecado'),
      item.source === 'GIT' && el('span', { class: 'badge b-git', title: 'Sincronizado desde catalog-info.yaml del repositorio' }, icon('brand-git'), 'desde git'),
      agentReady && el('span', { class: 'badge b-agent', title: 'Tiene instalación y ejemplo de uso' }, icon('robot'), 'listo para agentes'),
    ];

    const facts = [
      el('span', {}, icon('users'), item.owner),
      item.repoUrl && el('span', {}, icon('brand-git'), 'repositorio'),
      item.tags?.length > 0 && el('span', {}, item.tags.map((t) => `#${t}`).join(' ')),
    ];

    const detailId = `detail-${item.id}`;
    const card = el('article', { class: `card${deprecated ? ' deprecated' : ''}`, 'data-open': String(open) },
      el('button', {
        class: 'card-toggle', type: 'button', 'aria-expanded': String(open), 'aria-controls': detailId,
        onclick: () => { state.openId = open ? null : item.id; renderList(lastItems); },
      },
        el('div', { class: 'card-main' },
          el('div', { class: 'title-row' }, el('span', { class: 'name', text: item.name }), badges),
          el('p', { class: 'desc', text: item.description }),
          el('div', { class: 'facts' }, facts),
        ),
        el('i', { class: 'ti ti-chevron-down chev', 'aria-hidden': 'true' }),
      ),
    );

    if (open) {
      const links = [
        isSafeUrl(item.repoUrl) && el('a', { href: item.repoUrl, target: '_blank', rel: 'noopener noreferrer' }, icon('brand-git'), 'Repositorio'),
        isSafeUrl(item.docsUrl) && el('a', { href: item.docsUrl, target: '_blank', rel: 'noopener noreferrer' }, icon('book'), 'Documentación'),
      ].filter(Boolean);
      const reviewed = relativeReview(item.lastReviewedAt);
      const synced = item.source === 'GIT' && item.sourceRepo ? relativeReview(item.lastSyncedAt) : null;
      card.append(el('div', { class: 'detail', id: detailId },
        links.length > 0 && el('div', { class: 'links' }, links),
        item.install && [el('p', { class: 'detail-label', text: 'Instalación' }), el('pre', { class: 'code', text: item.install })],
        item.usageExample && [el('p', { class: 'detail-label', text: 'Ejemplo de uso' }), el('pre', { class: 'code', text: item.usageExample })],
        !agentReady && el('p', { class: 'hint', text: 'Falta información de instalación o uso. Completarla permite que los agentes lo usen.' }),
        item.source === 'GIT' && item.sourceRepo && el('p', { class: 'reviewed', text: `Sincronizado desde ${item.sourceRepo}${synced ? ` ${synced}` : ''}` }),
        reviewed && el('p', { class: 'reviewed', text: `Revisado ${reviewed}` }),
      ));
    }
    return card;
  }

  let lastItems = [];
  function renderList(items) {
    lastItems = items;
    $('count').textContent = `${items.length} ${items.length === 1 ? 'ítem' : 'ítems'}`;
    if (!items.length) {
      renderState('search-off', 'Todavía no hay coincidencias', 'Si ya existe, conviene cargarlo para que otros lo encuentren.');
      return;
    }
    $('list').replaceChildren(...items.map(renderCard));
  }

  async function load() {
    const seq = ++state.requestSeq;
    const params = new URLSearchParams();
    if (state.q) params.set('q', state.q);
    if (state.type !== 'ALL') params.set('type', state.type);
    try {
      const res = await fetch(`/api/items?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const items = await res.json();
      if (seq === state.requestSeq) renderList(items);
    } catch {
      if (seq !== state.requestSeq) return;
      $('count').textContent = '';
      renderState('cloud-off', 'No se pudo cargar el catálogo', 'Intenta de nuevo en unos segundos.');
    }
  }

  let debounce;
  $('q').addEventListener('input', (event) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = event.target.value.trim(); load(); }, 300);
  });

  function toggleForm(show) {
    $('form-panel').hidden = !show;
    $('add-btn').setAttribute('aria-expanded', String(show));
    if (show) $('f-name').focus();
    else { $('item-form').reset(); showError(''); }
  }
  function showError(message) {
    $('form-error').textContent = message;
    $('form-error').hidden = !message;
  }
  function toast(message) {
    const node = $('toast');
    node.textContent = message;
    node.classList.add('show');
    setTimeout(() => node.classList.remove('show'), 2400);
  }

  $('add-btn').addEventListener('click', () => toggleForm($('form-panel').hidden));
  $('cancel-btn').addEventListener('click', () => toggleForm(false));
  $('item-form').addEventListener('input', () => showError(''));

  $('item-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target));
    for (const key of Object.keys(data)) data[key] = data[key].trim();

    if (!data.name) return showError('El nombre es obligatorio.');
    if (!data.description) return showError('La descripción es obligatoria.');
    if (!data.owner) return showError('El responsable es obligatorio.');
    for (const [key, label] of [['repoUrl', 'repositorio'], ['docsUrl', 'documentación']]) {
      if (data[key] && !isSafeUrl(data[key])) return showError(`La URL de ${label} debe empezar con http:// o https://.`);
    }

    const payload = {
      name: data.name, type: data.type, description: data.description, owner: data.owner, status: data.status,
      tags: data.tags ? data.tags.split(',').map((t) => t.trim()).filter(Boolean) : [],
    };
    for (const key of ['repoUrl', 'docsUrl', 'install', 'usageExample']) if (data[key]) payload[key] = data[key];

    const save = $('save-btn');
    save.disabled = true;
    try {
      const res = await fetch('/api/items', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return showError(body.error || 'No se pudo guardar el ítem.');
      toggleForm(false);
      state.q = '';
      state.type = 'ALL';
      $('q').value = '';
      renderChips();
      state.openId = body.id;
      toast('Ítem agregado');
      await load();
    } catch {
      showError('No se pudo conectar con el servidor. Intenta de nuevo.');
    } finally {
      save.disabled = false;
    }
  });

  renderChips();
  load();
</script>
</body>
</html>
