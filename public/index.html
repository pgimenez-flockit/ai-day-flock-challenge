<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --brand-night: #1c002c;
    --brand-orange: #ff5102;
    --bg: #f7f5fa;
    --surface: #ffffff;
    --surface-alt: #efebf3;
    --text: #1c002c;
    --text-2: #5e4e6b;
    --text-3: #8b7f96;
    --border: rgba(28, 0, 44, 0.10);
    --border-strong: rgba(28, 0, 44, 0.22);
    --accent: #1c002c;
    --accent-hover: #3a1a4f;
    --accent-bg: #fff0e8;
    --accent-text: #b33a00;
    --link: #c2410c;
    --danger: #a32d2d;
    --warning-bg: #faeeda;
    --warning-text: #854f0b;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --t-service-bg: #eeedfe; --t-service-fg: #3c3489;
    --t-library-bg: #e1f5ee; --t-library-fg: #085041;
    --t-tool-bg: #faece7;    --t-tool-fg: #712b13;
    --t-feature-bg: #fbeaf0; --t-feature-fg: #72243e;
    --b-git-bg: #ece7f1; --b-git-fg: #4b3a5a;
    --radius: 8px;
    --radius-lg: 12px;
    --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12001d;
      --surface: #1e0a2b;
      --surface-alt: #2a1638;
      --text: #f4eff8;
      --text-2: #c3b6ce;
      --text-3: #8f7f9c;
      --border: rgba(244, 239, 248, 0.12);
      --border-strong: rgba(244, 239, 248, 0.24);
      --accent: #ff5102;
      --accent-hover: #ff7433;
      --accent-bg: #4a1a05;
      --accent-text: #ffb08a;
      --link: #ff8a52;
      --danger: #f09595;
      --warning-bg: #633806;
      --warning-text: #fac775;
      --success-bg: #27500a;
      --success-text: #c0dd97;
      --t-service-bg: #3c3489; --t-service-fg: #cecbf6;
      --t-library-bg: #085041; --t-library-fg: #9fe1cb;
      --t-tool-bg: #712b13;    --t-tool-fg: #f5c4b3;
      --t-feature-bg: #72243e; --t-feature-fg: #f4c0d1;
      --b-git-bg: #33204a; --b-git-fg: #d9cce4;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 64px; }

  .topbar { background: var(--brand-night); color: #fff; border-bottom: 3px solid var(--brand-orange); }
  .topbar-inner {
    max-width: 820px; margin: 0 auto; padding: 18px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .logo { height: 28px; width: auto; display: block; flex-shrink: 0; }
  .brand-divider { width: 1px; align-self: stretch; background: rgba(255, 255, 255, 0.24); }
  h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
  .subtitle { margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.72); }

  button, input, select, textarea { font: inherit; color: inherit; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px;
    border-radius: var(--radius); border: 1px solid var(--border-strong);
    background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .btn:focus-visible, .field:focus-visible, .chip:focus-visible, .card-toggle:focus-visible {
    outline: 2px solid var(--brand-orange); outline-offset: 2px;
  }

  .field {
    width: 100%; height: 38px; padding: 0 12px;
    border-radius: var(--radius); border: 1px solid var(--border-strong);
    background: var(--surface); transition: border-color 0.15s;
  }
  .field:hover { border-color: var(--text-3); }
  .field:focus { border-color: var(--brand-orange); outline: none; box-shadow: 0 0 0 3px rgba(255, 81, 2, 0.15); }

  .search { position: relative; margin-bottom: 14px; }
  .search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 18px; }
  .search .field { height: 46px; padding-left: 42px; font-size: 15px; border-radius: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 13px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border-strong); background: transparent;
    color: var(--text-2); cursor: pointer;
  }
  .chip:hover { border-color: var(--text-3); }
  .chip[aria-pressed="true"] { background: var(--brand-night); border-color: var(--brand-night); color: #fff; }

  .meta-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 10px; font-size: 12px; color: var(--text-3); }
  .list { display: grid; gap: 10px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: 0 2px 10px rgba(28, 0, 44, 0.06); }
  .card.deprecated { opacity: 0.72; }
  .card-toggle {
    display: flex; width: 100%; gap: 12px; align-items: flex-start; justify-content: space-between;
    padding: 16px 18px; background: none; border: 0; text-align: left; cursor: pointer;
    border-radius: var(--radius-lg);
  }
  .card-main { min-width: 0; }
  .title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .name { font-weight: 600; font-size: 15px; }
  .deprecated .name { text-decoration: line-through; color: var(--text-2); }
  .desc { margin: 6px 0 10px; font-size: 13.5px; color: var(--text-2); }
  .facts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-3); }
  .facts span { display: inline-flex; align-items: center; gap: 4px; }
  .chev { color: var(--text-3); font-size: 18px; flex-shrink: 0; transition: transform 0.2s; }
  .card[data-open="true"] .chev { transform: rotate(180deg); }

  .badge { font-size: 11.5px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .t-SERVICE { background: var(--t-service-bg); color: var(--t-service-fg); }
  .t-LIBRARY { background: var(--t-library-bg); color: var(--t-library-fg); }
  .t-TOOL    { background: var(--t-tool-bg);    color: var(--t-tool-fg); }
  .t-FEATURE { background: var(--t-feature-bg); color: var(--t-feature-fg); }
  .b-deprecated { background: var(--warning-bg); color: var(--warning-text); }
  .b-git { background: var(--b-git-bg); color: var(--b-git-fg); }
  .b-agent { background: var(--accent-bg); color: var(--accent-text); }
  .b-stack { background: var(--surface-alt); color: var(--text-2); border: 1px solid var(--border); }
  .b-stack-legacy { background: var(--warning-bg); color: var(--warning-text); border: 1px solid transparent; }
  .b-stack-modern { background: var(--success-bg); color: var(--success-text); border: 1px solid transparent; }

  .detail { border-top: 1px solid var(--border); margin: 0 18px; padding: 14px 0 16px; }
  .detail-label { margin: 0 0 4px; font-size: 12px; color: var(--text-3); }
  .code {
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word;
    background: var(--surface-alt); border-radius: var(--radius); padding: 10px 12px; margin: 0 0 12px;
  }
  .links { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; font-size: 13px; }
  .links a { color: var(--link); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .links a:hover { text-decoration: underline; }
  .hint { font-size: 13px; color: var(--text-2); margin: 0 0 10px; }
  .reviewed { font-size: 12px; color: var(--text-3); margin: 0; }

  .ask { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--brand-orange); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 20px; }
  .ask[hidden] { display: none; }
  .ask h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .ask h2 i { color: var(--brand-orange); }
  .ask-help { margin: 0 0 10px; font-size: 13px; color: var(--text-2); }
  .ask-row { display: flex; gap: 8px; align-items: flex-start; }
  .ask-row .field { flex: 1; min-width: 0; }
  .ask-row .btn { height: 38px; flex-shrink: 0; }
  .ask .chips { margin-top: 10px; }
  .ask .chip { font-size: 12.5px; padding: 4px 12px; text-align: left; }
  .error { font-size: 13px; color: var(--danger); margin: 10px 0 0; }
  .answer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .answer-text { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ref {
    display: inline; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border-strong);
    background: var(--accent-bg); color: var(--accent-text); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .ref:hover { border-color: var(--brand-orange); }
  .ref:focus-visible { outline: 2px solid var(--brand-orange); outline-offset: 2px; }

  .state {
    text-align: center; padding: 40px 16px; border: 1px dashed var(--border-strong);
    border-radius: var(--radius-lg); color: var(--text-2);
  }
  .state i { font-size: 26px; color: var(--text-3); }
  .state p { margin: 6px 0 0; font-size: 13.5px; }
  .state strong { display: block; margin-top: 8px; color: var(--text); font-weight: 600; font-size: 14.5px; }

  @media (max-width: 600px) {
    .wrap { padding-top: 20px; }
    .ask-row { flex-direction: column; }
    .ask-row .btn { width: 100%; justify-content: center; }
    .brand-divider, .subtitle { display: none; }
    .logo { height: 22px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img class="logo" src="brand/flock-isologo-blanco.png" alt="Flock IT" width="109" height="28">
      <span class="brand-divider" aria-hidden="true"></span>
      <div>
        <h1>Catálogo de Software</h1>
        <p class="subtitle">Servicios, librerías y aplicaciones reutilizables</p>
      </div>
    </div>
  </div>
</header>
<div class="wrap">

  <section class="ask" id="ask-box" aria-labelledby="ask-title" hidden>
    <h2 id="ask-title"><i class="ti ti-sparkles" aria-hidden="true"></i>Preguntar al catálogo</h2>
    <p class="ask-help">Haz una pregunta en lenguaje natural; la respuesta se basa solo en los ítems del catálogo.</p>
    <form id="ask-form" novalidate>
      <div class="ask-row">
        <input class="field" id="ask-input" maxlength="500" placeholder="¿Qué servicios siguen en Java 8?" aria-label="Pregunta sobre el catálogo" autocomplete="off">
        <button class="btn btn-primary" type="submit" id="ask-btn">Preguntar</button>
      </div>
    </form>
    <div class="chips" id="ask-chips" role="group" aria-label="Preguntas de ejemplo"></div>
    <p class="error" id="ask-error" role="alert" hidden></p>
    <div class="answer" id="ask-answer" aria-live="polite" hidden></div>
  </section>

  <div class="search">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input class="field" id="q" type="search" placeholder="Buscar por nombre, etiqueta, responsable o stack (ej. java 8)" aria-label="Buscar en el catálogo" autocomplete="off">
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
  <div class="meta-row"><span id="count" aria-live="polite"></span></div>
  <div class="list" id="list"></div>
</div>

<script>
  const TYPES = { SERVICE: 'Servicio', LIBRARY: 'Librería', TOOL: 'Herramienta', FEATURE: 'Funcionalidad' };
  const state = { q: '', type: 'ALL', openId: null, requestSeq: 0 };
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const icon = (name) => el('i', { class: `ti ti-${name}`, 'aria-hidden': 'true' });

  function isSafeUrl(value) {
    try { return ['http:', 'https:'].includes(new URL(value).protocol); } catch { return false; }
  }

  function relativeReview(iso) {
    if (!iso) return null;
    const days = Math.round((Date.now() - new Date(iso).getTime()) / 86400000);
    const rtf = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
    if (days < 31) return rtf.format(-days, 'day');
    if (days < 365) return rtf.format(-Math.round(days / 30), 'month');
    return rtf.format(-Math.round(days / 365), 'year');
  }

  const DISPLAY_NAMES = {
    javascript: 'JavaScript', typescript: 'TypeScript', nestjs: 'NestJS', nodejs: 'Node.js', dotnet: '.NET',
    csharp: 'C#', php: 'PHP', sql: 'SQL', vue: 'Vue', nextjs: 'Next.js',
  };
  const displayName = (slug) =>
    DISPLAY_NAMES[slug] || slug.split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  // Frameworks versioned by major release show only the major in the badge; the rest show major.minor.
  const MAJOR_ONLY = ['angular', 'react', 'vue', 'svelte', 'nextjs', 'nestjs', 'nuxt'];

  function stackLabel(stack) {
    const parts = [
      stack.language && [displayName(stack.language), stack.languageVersion].filter(Boolean).join(' '),
      stack.framework && [displayName(stack.framework), stack.frameworkVersion].filter(Boolean).join(' '),
    ].filter(Boolean);
    return parts.join(' · ');
  }

  function stackBadges(stack) {
    if (!stack) return [];
    const badges = [];
    if (stack.language) {
      let cls = 'b-stack';
      let title;
      if (stack.language === 'java' && stack.languageVersion) {
        const major = parseInt(stack.languageVersion, 10);
        if (major < 17) { cls = 'b-stack-legacy'; title = 'Versión de Java legacy'; }
        else if (major >= 17) cls = 'b-stack-modern';
      }
      badges.push(el('span', { class: `badge ${cls}`, title }, [displayName(stack.language), stack.languageVersion].filter(Boolean).join(' ')));
    }
    if (stack.framework) {
      const parts = (stack.frameworkVersion || '').split('.');
      const shown = stack.frameworkVersion
        ? parts.slice(0, MAJOR_ONLY.includes(stack.framework) ? 1 : 2).join('.')
        : '';
      let fwCls = 'b-stack';
      let fwTitle;
      if (stack.framework === 'angular' && stack.frameworkVersion) {
        if (parseInt(stack.frameworkVersion, 10) < 16) { fwCls = 'b-stack-legacy'; fwTitle = 'Versión de Angular legacy'; }
      }
      badges.push(el('span', { class: `badge ${fwCls}`, title: fwTitle }, [displayName(stack.framework), shown].filter(Boolean).join(' ')));
    }
    return badges;
  }

  function renderChips() {
    const options = [['ALL', 'Todos'], ...Object.entries(TYPES)];
    $('chips').replaceChildren(...options.map(([value, label]) =>
      el('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(state.type === value),
        onclick: () => { state.type = value; renderChips(); load(); },
      }, label)
    ));
  }

  function renderState(iconName, title, text) {
    $('list').replaceChildren(el('div', { class: 'state' }, icon(iconName), el('strong', { text: title }), el('p', { text })));
  }

  function renderCard(item) {
    const deprecated = item.status === 'DEPRECATED';
    const agentReady = Boolean(item.install && item.usageExample);
    const open = state.openId === item.id;

    const badges = [
      el('span', { class: `badge t-${item.type}` }, (TYPES[item.type] || item.type).toLowerCase()),
      stackBadges(item.stack),
      deprecated && el('span', { class: 'badge b-deprecated' }, 'deprecado'),
      item.source === 'GIT' && el('span', { class: 'badge b-git', title: 'Sincronizado desde catalog-info.yaml del repositorio' }, icon('brand-git'), 'desde git'),
      agentReady && el('span', { class: 'badge b-agent', title: 'Tiene instalación y ejemplo de uso' }, icon('robot'), 'listo para agentes'),
    ];

    const facts = [
      el('span', {}, icon('users'), item.owner),
      item.repoUrl && el('span', {}, icon('brand-git'), 'repositorio'),
      item.tags?.length > 0 && el('span', {}, item.tags.map((t) => `#${t}`).join(' ')),
    ];

    const detailId = `detail-${item.id}`;
    const card = el('article', { class: `card${deprecated ? ' deprecated' : ''}`, 'data-open': String(open) },
      el('button', {
        class: 'card-toggle', type: 'button', 'aria-expanded': String(open), 'aria-controls': detailId,
        onclick: () => { state.openId = open ? null : item.id; renderList(lastItems); },
      },
        el('div', { class: 'card-main' },
          el('div', { class: 'title-row' }, el('span', { class: 'name', text: item.name }), badges),
          el('p', { class: 'desc', text: item.description }),
          el('div', { class: 'facts' }, facts),
        ),
        el('i', { class: 'ti ti-chevron-down chev', 'aria-hidden': 'true' }),
      ),
    );

    if (open) {
      const links = [
        isSafeUrl(item.repoUrl) && el('a', { href: item.repoUrl, target: '_blank', rel: 'noopener noreferrer' }, icon('brand-git'), 'Repositorio'),
        isSafeUrl(item.docsUrl) && el('a', { href: item.docsUrl, target: '_blank', rel: 'noopener noreferrer' }, icon('book'), 'Documentación'),
      ].filter(Boolean);
      const reviewed = relativeReview(item.lastReviewedAt);
      const synced = item.source === 'GIT' && item.sourceRepo ? relativeReview(item.lastSyncedAt) : null;
      card.append(el('div', { class: 'detail', id: detailId },
        links.length > 0 && el('div', { class: 'links' }, links),
        item.stack && stackLabel(item.stack) && el('p', { class: 'hint', text: `Stack: ${stackLabel(item.stack)}` }),
        item.install && [el('p', { class: 'detail-label', text: 'Instalación' }), el('pre', { class: 'code', text: item.install })],
        item.usageExample && [el('p', { class: 'detail-label', text: 'Ejemplo de uso' }), el('pre', { class: 'code', text: item.usageExample })],
        !agentReady && el('p', { class: 'hint', text: 'Falta información de instalación o uso. Completarla permite que los agentes lo usen.' }),
        item.source === 'GIT' && item.sourceRepo && el('p', { class: 'reviewed', text: `Sincronizado desde ${item.sourceRepo}${synced ? ` ${synced}` : ''}` }),
        reviewed && el('p', { class: 'reviewed', text: `Revisado ${reviewed}` }),
      ));
    }
    return card;
  }

  let lastItems = [];
  function renderList(items) {
    lastItems = items;
    $('count').textContent = `${items.length} ${items.length === 1 ? 'ítem' : 'ítems'}`;
    if (!items.length) {
      renderState('search-off', 'Todavía no hay coincidencias', 'Prueba con otros términos o consulta al equipo responsable.');
      return;
    }
    $('list').replaceChildren(...items.map(renderCard));
  }

  async function load() {
    const seq = ++state.requestSeq;
    const params = new URLSearchParams();
    if (state.q) params.set('q', state.q);
    if (state.type !== 'ALL') params.set('type', state.type);
    try {
      const res = await fetch(`/api/items?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const items = await res.json();
      if (seq === state.requestSeq) renderList(items);
    } catch {
      if (seq !== state.requestSeq) return;
      $('count').textContent = '';
      renderState('cloud-off', 'No se pudo cargar el catálogo', 'Intenta de nuevo en unos segundos.');
    }
  }

  let debounce;
  $('q').addEventListener('input', (event) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = event.target.value.trim(); load(); }, 300);
  });

  // --- Preguntar al catálogo ---
  const EXAMPLES = [
    '¿Qué servicios siguen en Java 8?',
    '¿Hay alguna librería para autenticación?',
    '¿Qué templates hay para crear web components?',
  ];
  let asking = false;

  function showAskError(message) {
    $('ask-error').textContent = message;
    $('ask-error').hidden = !message;
  }

  function openItem(id) {
    state.q = '';
    state.type = 'ALL';
    state.openId = id;
    $('q').value = '';
    renderChips();
    load().then(() => {
      const card = document.getElementById(`detail-${id}`)?.closest('.card');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  // Model output is only ever inserted as text nodes; [#id name] references become buttons.
  function renderAnswer(answer, items) {
    const known = new Set(items.map((i) => i.id));
    const nodes = [];
    let last = 0;
    for (const m of answer.matchAll(/\[#(\d{1,9})\b[^\]]*\]/g)) {
      const id = Number(m[1]);
      if (!known.has(id)) continue;
      nodes.push(answer.slice(last, m.index));
      nodes.push(el('button', {
        class: 'ref', type: 'button', title: 'Ver en el catálogo', onclick: () => openItem(id),
      }, items.find((i) => i.id === id).name));
      last = m.index + m[0].length;
    }
    nodes.push(answer.slice(last));
    $('ask-answer').replaceChildren(el('p', { class: 'answer-text' }, nodes));
    $('ask-answer').hidden = false;
  }

  async function submitAsk(question) {
    question = question.trim();
    if (asking) return;
    if (question.length < 3 || question.length > 500) {
      return showAskError('La pregunta debe tener entre 3 y 500 caracteres.');
    }
    asking = true;
    showAskError('');
    $('ask-answer').hidden = true;
    const button = $('ask-btn');
    button.disabled = true;
    button.textContent = 'Consultando…';
    try {
      const res = await fetch('/api/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return showAskError(body.error || 'No se pudo consultar al asistente. Intenta de nuevo.');
      renderAnswer(String(body.answer || ''), Array.isArray(body.items) ? body.items : []);
    } catch {
      showAskError('No se pudo conectar con el servidor. Intenta de nuevo.');
    } finally {
      asking = false;
      button.disabled = false;
      button.textContent = 'Preguntar';
    }
  }

  function initAsk() {
    $('ask-chips').replaceChildren(...EXAMPLES.map((text) =>
      el('button', {
        class: 'chip', type: 'button',
        onclick: () => { $('ask-input').value = text; submitAsk(text); },
      }, text)
    ));
    $('ask-form').addEventListener('submit', (event) => {
      event.preventDefault();
      submitAsk($('ask-input').value);
    });
    $('ask-input').addEventListener('input', () => showAskError(''));
    fetch('/api/ask/status')
      .then((res) => (res.ok ? res.json() : { enabled: false }))
      .then((body) => { $('ask-box').hidden = !body.enabled; })
      .catch(() => {});
  }

  renderChips();
  initAsk();
  load();
</script>
</body>
</html>
